<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Chat</title>
    
    <!-- Firebase Libraries (Compat Version for Easy Integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* App Layout */
        .chat-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            background: #f8f9fa;
            position: relative;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }

        /* Header */
        .chat-header {
            background: #ffffff;
            padding: 12px 16px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .chat-header h2 {
            font-size: 1.1rem;
            color: #212529;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ec4b6;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px; /* Minimal WhatsApp-like gap */
            background-color: #f7f8fa;
        }

        /* Message Bubbles */
        .message-bubble {
            max-width: 78%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            animation: fadeIn 0.15s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sent Message (Right) */
        .message-bubble.sent {
            align-self: flex-end;
            background-color: #0084ff;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        /* Received Message (Left) */
        .message-bubble.received {
            align-self: flex-start;
            background-color: #ffffff;
            color: #1c1e21;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            border: 1px solid #edf2f7;
        }

        /* Time Stamp */
        .message-time {
            font-size: 0.68rem;
            margin-top: 3px;
            text-align: right;
            opacity: 0.75;
        }

        /* Image Message Styling */
        .message-image {
            max-width: 100%;
            border-radius: 8px;
            display: block;
            margin-bottom: 4px;
            cursor: pointer;
        }

        /* Input Container (WhatsApp Style Bottom Bar) */
        .input-container {
            background: #ffffff;
            padding: 8px 10px;
            border-top: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .attachment-btn {
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .attachment-btn:active {
            background: #edf2f7;
        }

        .chat-input {
            flex: 1;
            border: 1px solid #e2e8f0;
            background: #f8f9fa;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 0.95rem;
            outline: none;
            color: #2d3748;
            transition: border-color 0.2s, background 0.2s;
        }

        .chat-input:focus {
            background: #ffffff;
            border-color: #0084ff;
        }

        .send-btn {
            background: #0084ff;
            border: none;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            flex-shrink: 0;
        }

        .send-btn:active {
            transform: scale(0.92);
        }

        /* Hidden File Input */
        #image-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-app">
    <!-- Header -->
    <div class="chat-header">
        <h2><span class="status-dot"></span>Live Chat</h2>
    </div>

    <!-- Message Area -->
    <div class="messages-container" id="messages-container"></div>

    <!-- Bottom Input Box -->
    <div class="input-container">
        <!-- Image Attachment Icon -->
        <button class="attachment-btn" onclick="document.getElementById('image-input').click()" title="इमेज भेजें">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <input type="file" id="image-input" accept="image/*" onchange="handleImageUpload(event)">

        <!-- Text Input Field (Supports Emojis & GIFs directly from keyboard) -->
        <input type="text" id="chat-input" class="chat-input" placeholder="मैसेज टाइप करें..." autocomplete="off">

        <!-- Send Button -->
        <button class="send-btn" onclick="sendMessage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
    </div>
</div>

<script>
    // ------------------------------------------------------------------
    // 1. Firebase Credentials Placeholder (यहाँ अपने Firebase डिटेल्स डालें)
    // ------------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase Initialize (जब आप क्रेडेंशियल डालेंगे तब यह ऑटो-कनेक्ट हो जाएगा)
    let db = null;
    try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            listenForMessages();
        }
    } catch (e) {
        console.warn("Firebase क्रेडेंशियल सेट नहीं किए गए हैं।");
    }

    // ------------------------------------------------------------------
    // 2. Anonymous User Identity
    // ------------------------------------------------------------------
    let myUserId = localStorage.getItem('chat_user_id');
    if (!myUserId) {
        myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('chat_user_id', myUserId);
    }

    const messagesContainer = document.getElementById('messages-container');
    const chatInput = document.getElementById('chat-input');

    // ------------------------------------------------------------------
    // 3. Send Message Function
    // ------------------------------------------------------------------
    function sendMessage(imageURL = null) {
        const text = chatInput.value.trim();
        if (!text && !imageURL) return;

        const messageData = {
            senderId: myUserId,
            text: text || null,
            image: imageURL || null,
            timestamp: Date.now()
        };

        if (db) {
            // Real Firebase Database
            db.ref('chat_messages').push(messageData);
        } else {
            // Local Preview (Firebase लिंक डालने से पहले टेस्ट करने के लिए)
            renderSingleMessage(messageData);
        }

        chatInput.value = '';
    }

    // Enter Key Handler
    chatInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // ------------------------------------------------------------------
    // 4. Realtime Message Listener from Firebase
    // ------------------------------------------------------------------
    function listenForMessages() {
        if (!db) return;
        db.ref('chat_messages').limitToLast(100).on('child_added', (snapshot) => {
            const data = snapshot.val();
            renderSingleMessage(data);
        });
    }

    // ------------------------------------------------------------------
    // 5. Render Message Bubble on Screen
    // ------------------------------------------------------------------
    function renderSingleMessage(data) {
        const isMe = data.senderId === myUserId;
        const bubble = document.createElement('div');
        bubble.className = `message-bubble ${isMe ? 'sent' : 'received'}`;

        let contentHtml = '';

        // Display Image if present
        if (data.image) {
            contentHtml += `<img src="${data.image}" class="message-image" alt="Uploaded Image" onclick="window.open('${data.image}', '_blank')">`;
        }

        // Display Text
        if (data.text) {
            contentHtml += `<div>${escapeHTML(data.text)}</div>`;
        }

        // Time format
        const timeStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        contentHtml += `<div class="message-time">${timeStr}</div>`;

        bubble.innerHTML = contentHtml;
        messagesContainer.appendChild(bubble);

        // Auto Scroll to Bottom
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ------------------------------------------------------------------
    // 6. Image Compression & Handling (< 1MB Guarantee)
    // ------------------------------------------------------------------
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        compressImage(file, function (compressedBase64) {
            sendMessage(compressedBase64);
            event.target.value = ''; // Reset input
        });
    }

    function compressImage(file, callback) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (e) {
            const img = new Image();
            img.src = e.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxResolution = 1200; // High quality resolution limit

                if (width > height) {
                    if (width > maxResolution) {
                        height *= maxResolution / width;
                        width = maxResolution;
                    }
                } else {
                    if (height > maxResolution) {
                        width *= maxResolution / height;
                        height = maxResolution;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Initial compression quality 0.8 (Sharp & Crystal Clear)
                let quality = 0.8;
                let dataUrl = canvas.toDataURL('image/jpeg', quality);

                // Ensure base64 string is strictly below 1 MB (~1,000,000 chars)
                while (dataUrl.length > 950000 && quality > 0.2) {
                    quality -= 0.1;
                    dataUrl = canvas.toDataURL('image/jpeg', quality);
                }

                callback(dataUrl);
            };
        };
    }

    // Security Helper
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }
</script>

</body>
</html>
